name: Rename portfolio to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "Kosanah"
          git config user.email "Kosanah@users.noreply.github.com"
          git mv portfolio.html index.html
          git commit -m "Rename portfolio.html to index.html"
          git push
